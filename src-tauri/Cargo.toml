[package]
name = "candid"
version = "0.1.2"
description = "Private local student calendar"
authors = ["Candid contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/webwizarding/candid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
snow = "0.10"
tokio = { version = "1", features = ["fs", "net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
