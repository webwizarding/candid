name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach installers to
        required: true
        default: v0.1.4
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch locked native dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Collect third-party notices
        run: npm run release:notices
      - name: Validate source
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build Windows installer
        run: npm run desktop:build -- --bundles nsis
      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*.exe')
          if ($assets.Count -ne 1) { throw 'Expected one Windows EXE installer.' }
          $installer = Join-Path $PWD 'Candid-Windows-Setup.exe'
          Copy-Item $assets[0].FullName $installer
          & gh release upload $env:RELEASE_TAG $installer --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
